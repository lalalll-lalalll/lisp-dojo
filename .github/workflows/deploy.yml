# .github/workflows/deploy.yml

name: Deploy VitePress site to Pages

on:
  # 当代码推送到 main 分支时触发
  push:
    branches: [main]

  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 确保同一时间只有一个部署任务在运行
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取所有历史记录，以便 VitePress 能处理日期

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm # 自动缓存 npm 依赖，加速构建

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true # 确保 Pages 功能已启用
          # 对于用户/组织站点，需要指定仓库名
          repository: lisp-dojo/lisp-dojo 

      - name: Install dependencies
        run: npm ci # 使用 ci 而非 install，确保依赖版本严格一致

      - name: Build with VitePress
        run: npm run docs:build # 根据你的 package.json 中的脚本调整

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist # VitePress 默认的构建输出目录

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4